# Publish the browser version of the app to GitHub Pages.
#
# The page is static. It carries the Python source, and a visitor's browser runs it —
# so recordings a user picks are read on their own machine and never reach a server.
# There is no server to reach.
#
# The site is rebuilt on every push to main, so the link never changes and an update
# reaches the people using it the next time they reload.
name: publish the browser app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The check needs an interpreter and nothing else: it imports only the standard
      # library. `python3` rather than `python`, which a runner need not have on the path.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to publish if anything patient-related would go with it
        run: python3 src/check_before_publish.py

      # markdown is needed only to turn docs/*.md into the guides. It is deliberately not
      # in requirements.txt, so it never gets bundled into the desktop downloads.
      - name: Install what the site build needs
        run: pip install markdown==3.10.3

      - name: Build the site
        run: python3 web/build_site.py --out site

      # The same check that runs locally: every link and asset resolves, no template
      # placeholder is left showing, and the app has every Python file it imports. It
      # reads those lists out of the pages themselves rather than keeping a second copy,
      # because a second copy drifts and then stops checking anything.
      - name: Check every link and asset resolves
        run: python3 web/check_site.py --site site

      - name: Confirm no recording was swept into the site
        run: |
          if find site -name '*_eventonly.csv' -o -name '*.parquet' | grep -q .; then
            echo "a recording or a results file reached the published site"
            exit 1
          fi
          echo "no recordings in the site"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
