# Build the downloadable Windows and Mac versions and attach them to a release.
#
# The Mac bundle has been built and run on an Apple-silicon Mac: it serves the page and
# executes the app. The Windows executable has still never been run by anyone, because a
# Windows build cannot be tested from a Mac. Until somebody confirms it on an actual
# Windows machine, point Windows users at the browser version, which needs no download,
# no install and no security exception.
#
# Two things to expect even when it does work:
#   - Windows shows "Windows protected your PC" for any unsigned program. The user has to
#     click "More info" and then "Run anyway". Removing that warning needs a code-signing
#     certificate, which costs a few hundred a year.
#   - The download is large, in the region of 300-400 MB, because it carries Python and
#     every library with it.
name: build the downloads

on:
  push:
    branches: [main]      # so a downloadable build always exists, and packaging
  workflow_dispatch:      # problems surface now rather than months from now
  release:
    types: [published]

# needed to attach the built files to a release
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # Windows and Mac open their own folder chooser as a separate program, so nothing
      # needs to be bundled for it. tkinter is only the fallback for systems without
      # one, which is why this reports rather than fails.
      - name: Note whether the fallback folder chooser is available
        continue-on-error: true
        run: python -c "import tkinter; print('tkinter present:', tkinter.TkVersion)"

      # So a copy left running can be told apart from a current one on screen.
      - name: Stamp which build this is
        run: |
          "built $(Get-Date -Format yyyy-MM-dd) from ${{ github.sha }}".Substring(0, 30) |
            Out-File -Encoding utf8 -NoNewline build-info.txt
          Get-Content build-info.txt

      - name: Build
        run: |
          pyinstaller --onefile --name EMG-Pipeline `
            --icon web/assets/icon.ico `
            --collect-all streamlit `
            --collect-all pandas `
            --collect-all matplotlib `
            --collect-all seaborn `
            --collect-all pyarrow `
            --collect-data openpyxl `
            --add-data "src;src" `
            --add-data "config;config" `
            --add-data "app.py;." `
            --add-data "build-info.txt;." `
            launcher.py

      # Two separate questions. A server that answers is not the same as an app that runs:
      # with a data file missing from the bundle the port still answers 200 while the app
      # opens to an error page, so the second check is the one that matters.
      - name: Check it starts, and that the app itself runs
        run: |
          $env:STREAMLIT_SERVER_SCRIPT_HEALTH_CHECK_ENABLED = "true"
          Start-Process -FilePath "dist\EMG-Pipeline.exe" `
            -RedirectStandardOutput app.log -RedirectStandardError app.err
          $answered = $false
          for ($i = 1; $i -le 40; $i++) {
            Start-Sleep -Seconds 3
            try {
              $h = Invoke-WebRequest "http://localhost:8501/_stcore/health" -UseBasicParsing -TimeoutSec 5
              if ($h.StatusCode -eq 200) { $answered = $true; break }
            } catch { }
          }
          if (-not $answered) {
            "the executable built but never answered on port 8501. What it printed:"
            Get-Content app.log, app.err -ErrorAction SilentlyContinue
            exit 1
          }
          "answered after about $($i * 3) seconds"
          try {
            $r = Invoke-WebRequest "http://localhost:8501/_stcore/script-health-check" `
                   -UseBasicParsing -TimeoutSec 120
            "the app ran without error: $($r.Content)"
          } catch {
            "the server started but the app itself failed to run. What it printed:"
            Get-Content app.log, app.err -ErrorAction SilentlyContinue
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()          # upload even if the smoke test failed, so it can be examined
        with:
          name: EMG-Pipeline-Windows
          path: dist/EMG-Pipeline.exe
          retention-days: 90

      # An Actions artifact can only be downloaded by someone signed in to GitHub. A file
      # attached to a release is a plain link anyone can click, which is what a colleague
      # without a GitHub account needs.
      - name: Attach it to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/EMG-Pipeline.exe --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Where to find it
        if: success()
        run: |
          "Signed in to GitHub? The Artifacts section of this run."
          "Otherwise it needs to come from a release, which needs no account."
          "Windows will warn that it is unrecognised: click More info, then Run anyway."
          "That warning appears for any program without a paid signing certificate."

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check this build will have a folder chooser
        run: python3 -c "import tkinter; print('tkinter present:', tkinter.TkVersion)"

      - name: Stamp which build this is
        run: |
          echo "built $(date -u +%Y-%m-%d) from $(echo ${{ github.sha }} | cut -c1-7)" > build-info.txt
          cat build-info.txt

      - name: Build
        run: |
          pyinstaller --windowed --name EMG-Pipeline \
            --icon web/assets/icon.icns \
            --collect-all streamlit \
            --collect-all pandas \
            --collect-all matplotlib \
            --collect-all seaborn \
            --collect-all pyarrow \
            --collect-data openpyxl \
            --add-data "src:src" \
            --add-data "config:config" \
            --add-data "app.py:." \
            --add-data "build-info.txt:." \
            launcher.py

      - name: Check it starts, and that the app itself runs
        run: |
          export STREAMLIT_SERVER_SCRIPT_HEALTH_CHECK_ENABLED=true
          ./dist/EMG-Pipeline.app/Contents/MacOS/EMG-Pipeline > app.log 2>&1 &
          answered=no
          for i in $(seq 1 40); do
            sleep 3
            if curl -sf http://localhost:8501/_stcore/health >/dev/null; then
              echo "answered after about $((i * 3)) seconds"
              answered=yes
              break
            fi
          done
          if [ "$answered" = no ]; then
            echo "the bundle built but never answered on port 8501. What it printed:"
            cat app.log
            exit 1
          fi
          # this one actually executes pi_app.py, so a missing module or data file fails here
          if curl -sf --max-time 120 http://localhost:8501/_stcore/script-health-check; then
            echo ""
            echo "the app ran without error"
          else
            echo "the server started but the app itself failed to run. What it printed:"
            cat app.log
            exit 1
          fi

      # ditto rather than zip. A Mac app is a folder held together by symlinks — 546 of
      # them here — and `zip -r` follows a symlink and stores a copy of what it points
      # at. That flattens Python.framework, macOS then reports "bundle format is
      # ambiguous", and what the person downloading it sees is a plain folder with no
      # app to open. ditto is Apple's own archiver and keeps them. It also halves the
      # download, since the copies are what made it large.
      - name: Pack it, so the bundle survives being downloaded
        if: always()
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent EMG-Pipeline.app EMG-Pipeline-Mac.zip

      - name: Unpack it again and confirm it is still an app
        if: always()
        run: |
          mkdir -p roundtrip && ditto -x -k dist/EMG-Pipeline-Mac.zip roundtrip
          links=$(find roundtrip/EMG-Pipeline.app -type l | wc -l | tr -d ' ')
          echo "symlinks that survived: $links"
          if [ "$links" -eq 0 ]; then
            echo "the archive flattened the symlinks; this would download as a folder"
            exit 1
          fi
          codesign -v --verbose=2 roundtrip/EMG-Pipeline.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EMG-Pipeline-Mac
          path: dist/EMG-Pipeline-Mac.zip
          retention-days: 90

      - name: Attach it to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/EMG-Pipeline-Mac.zip --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}
