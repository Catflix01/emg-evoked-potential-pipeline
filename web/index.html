<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMG pipeline</title>

  <!-- stlite runs Python inside the browser. The recordings a user picks are read by
       that in-browser Python and never sent to a server; there is no server.
       Version 1.x bundles its own styles into the script, so there is no stylesheet. -->

  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 1rem; padding: 2rem; text-align: center;
    }
    #loading h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    #loading p { margin: 0; max-width: 34rem; line-height: 1.6; opacity: .8; }
    .spinner {
      width: 2.5rem; height: 2.5rem; border: 3px solid currentColor;
      border-top-color: transparent; border-radius: 50%; opacity: .4;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>Starting the EMG pipeline</h1>
    <p>
      This takes about half a minute the first time, while your browser downloads the
      software. After that it is quick.
    </p>
    <p>
      Everything runs on this computer. Your recordings are never sent anywhere.
    </p>
  </div>

  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

    // Fetched from this same folder, so the browser app runs the identical Python
    // that the command-line version does.
    const sourceFiles = [
      "pi_app.py",
      "src/harmonize.py",
      "src/cusum.py",
      "src/figures.py",
      "config/params.yaml",
    ];

    const files = Object.fromEntries(
      sourceFiles.map((path) => [path, { url: path }])
    );

    mount(
      {
        // Only packages Pyodide itself ships. If one of these cannot be resolved the
        // whole install fails and nothing is available, not even pandas, so anything
        // pure-Python that Pyodide lacks (openpyxl) is installed by the app instead,
        // where a failure can be caught and explained.
        requirements: ["pandas", "numpy", "matplotlib", "pyyaml"],
        entrypoint: "pi_app.py",
        files,
      },
      document.getElementById("root")
    );

    // the placeholder disappears once Streamlit has painted
    const root = document.getElementById("root");
    new MutationObserver((_, observer) => {
      if (root.childElementCount > 0) {
        document.getElementById("loading").remove();
        observer.disconnect();
      }
    }).observe(root, { childList: true, subtree: true });
  </script>
</body>
</html>
