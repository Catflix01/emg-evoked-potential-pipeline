<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMG pipeline</title>

  <!-- stlite runs Python inside the browser. The recordings a user picks are read by
       that in-browser Python and never sent to a server; there is no server.
       Version 1.x bundles its own styles into the script, so there is no stylesheet. -->

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>Starting the EMG pipeline</h1>
    <p>
      This takes about half a minute the first time, while your browser downloads the
      software. After that it is quick.
    </p>
    <p>
      Everything runs on this computer. Your recordings are never sent anywhere.
    </p>
  </div>

  <div id="root"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
